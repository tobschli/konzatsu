name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/konzatsu

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = tag ]; then
            ver="${GITHUB_REF#refs/tags/v}"
          else
            # Manual run: use the latest v* tag (default branch is checked out)
            ver="$(git ls-remote --tags origin 'refs/tags/v*' --refs --sort=-v:refname | sed 's|.*refs/tags/v||' | head -1)"
          fi
          if [ -z "${ver}" ]; then
            echo "No v* tag found. Tag a release first: git tag v1.0.4 && git push --tags" >&2
            exit 1
          fi
          echo "version=${ver}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        run: |
          ver="${{ steps.version.outputs.version }}"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file Dockerfile \
            --tag "${IMAGE}:${ver}" \
            --tag "${IMAGE}:latest" \
            --push .
